# Canonical reusable tag-release workflow.
#
# Called by each repo's ~10-line tag-release.yml. Every policy that legitimately
# differs between repos is an input; everything else is fixed here so it cannot
# drift across repos.
#
# Pin callers to a tag (@v1), not a branch, so a change here is adopted
# deliberately rather than by surprise.

name: Tag Release

on:
  workflow_call:
    inputs:
      version-manifest:
        description: >-
          Cargo.toml holding the released version. Use the member manifest when
          the root is a virtual manifest (e.g. server/Cargo.toml).
        type: string
        default: Cargo.toml
      tag-prefix:
        description: Prefix for the created tag.
        type: string
        default: v
      dev-bump:
        description: >-
          How the next development version lands: "pr" opens a bump PR,
          "direct" pushes to main, "none" skips it.
        type: string
        default: pr
      only-repository:
        description: >-
          owner/name this release may run in. Set it when the repo is forked, so
          a fork's main does not tag. Empty means run anywhere.
        type: string
        default: ''
      dev-bump-package:
        description: >-
          Restrict the dev bump to one workspace member, passed to
          `cargo release version` as `-p <name>`. Set it when version-manifest
          names one member of a workspace whose other members version on their
          own cadence; bumping the whole workspace there would reset them to
          the product's version, and refuse outright where that is a downgrade.
          Empty bumps every member sharing the version.
        type: string
        default: ''
      dev-bump-style:
        description: >-
          Shape of the next development version. "alpha" is
          MAJOR.MINOR.(PATCH+1)-alpha.0. "patch" is the bare
          MAJOR.MINOR.(PATCH+1), for a repository whose next release finalizes
          the version in place, or whose path dependencies carry caret
          requirements (`version = "0.6"`) that a prerelease does not satisfy.
        type: string
        default: alpha
    secrets:
      RELEASE_TOKEN:
        description: >-
          A PAT with `contents: write` (and `pull-requests: write` when
          dev-bump is "pr"). Declared so a caller in ANOTHER organization can
          pass it by name: `secrets: inherit` only carries secrets between
          repositories in the same organization or enterprise, and a caller
          elsewhere that relies on it reaches checkout with an empty token
          (ringline-rs/ringline, 2026-09-09). Callers in this organization may
          still use `secrets: inherit`.
        required: true
    outputs:
      version:
        description: The version that was released.
        value: ${{ jobs.tag-release.outputs.version }}
      tagged:
        description: '"true" when this run created a tag.'
        value: ${{ jobs.tag-release.outputs.tagged }}

# The release commit forms, defined once. A caller cannot change these.
#
# Both `release: v1.2.3` and `release: prepare v1.2.3` are accepted, because
# repositories arrived here using one or the other and forcing them to switch
# in the same change that swaps the workflow couples two risky edits. The merge
# commit form is accepted too, so a repository that does not squash-merge its
# release PR still tags.
#
# Breadth here is safe because the gate does not stop at the prefix: the version
# named in the commit must equal the version in the manifest.

jobs:
  tag-release:
    name: Tag release and bump dev version
    runs-on: ubuntu-latest
    # Deliberately minimal, and NOT contents: write.
    #
    # Every write here authenticates with RELEASE_TOKEN, not GITHUB_TOKEN:
    # checkout takes the PAT, so the tag and bump pushes use its credentials,
    # and `gh pr create` runs with GH_TOKEN set to it. The job's own token needs
    # nothing beyond read.
    #
    # This is also what lets a caller stay a bare `uses:` block. A called
    # workflow may not request more than its caller holds, and a repository
    # whose default workflow permissions are read-only grants
    # `contents: read, pull-requests: none` — so requesting write here would
    # force every caller to carry a permissions block, and would fail loudly
    # for any that forgot.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagged: ${{ steps.tag.outputs.tagged }}

    steps:
      # Gate in a step, not in `if:`, so a skipped release says why in the log
      # rather than vanishing from the run list entirely.
      #
      # Values reach the script through env, never through `${{ }}` inside run:
      # — a commit message is attacker-controlled text and interpolating it into
      # the script is a shell injection.
      - name: Is this a release commit?
        id: gate
        env:
          MSG: ${{ github.event.head_commit.message }}
          ONLY: ${{ inputs.only-repository }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$ONLY" ] && [ "$ONLY" != "$REPO" ]; then
            echo "Release is gated to ${ONLY}; this is ${REPO}. Nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Cheap pre-check so an ordinary push does not pay for a checkout.
          # The authoritative check is "Verify the commit names this version".
          if printf '%s' "$MSG" | head -1 | grep -qE '^release: (prepare )?v?[0-9]' \
             || printf '%s' "$MSG" | grep -q 'release/v'; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Head commit is not a release commit. Nothing to do."
            echo "  $(printf '%s' "$MSG" | head -1)"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      # Fail here with the cause rather than inside actions/checkout, whose
      # message for an empty token ("Input required and not supplied: token")
      # does not say which secret, or that `secrets: inherit` does not cross
      # an organization boundary.
      - name: Verify RELEASE_TOKEN reached this workflow
        if: steps.gate.outputs.proceed == 'true'
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is empty. Set it as a repository secret and pass it by name under the caller's 'secrets:' key (see README). 'secrets: inherit' only carries it when the caller is in the same organization as this workflow."
            exit 1
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.proceed == 'true'
        with:
          fetch-depth: 0
          # A PAT, because the default GITHUB_TOKEN cannot trigger other
          # workflows and cannot push past branch protection.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure git
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Section-aware, so a `version = ` under [dependencies] cannot be mistaken
      # for the package version. `grep -m1 '^version = '` gets this wrong on any
      # manifest whose first version key is not the package's.
      - name: Extract version
        id: version
        if: steps.gate.outputs.proceed == 'true'
        run: |
          VERSION=$(awk -F' *= *' '
            /^\[/  { inpkg = ($0 ~ /^\[(package|workspace\.package)\]/); next }
            inpkg && $1 == "version" { gsub(/"/, "", $2); print $2; exit }
          ' '${{ inputs.version-manifest }}')
          if [ -z "$VERSION" ]; then
            echo "::error::no [package] or [workspace.package] version in ${{ inputs.version-manifest }}"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      # The check that can actually fail. A release PR whose title was edited, or
      # rebased onto a different bump, produces a commit that passes the prefix
      # pre-check while naming a version the manifest does not hold — which
      # would otherwise tag whatever the manifest happens to say.
      - name: Verify the commit names this version
        if: steps.gate.outputs.proceed == 'true'
        env:
          MSG: ${{ github.event.head_commit.message }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ESC=${VERSION//./\\.}
          if printf '%s' "$MSG" | head -1 | grep -qE "^release: (prepare )?v${ESC}([^0-9.]|$)" \
             || printf '%s' "$MSG" | grep -qE "release/v${ESC}([^0-9.]|$)"; then
            echo "Commit names v${VERSION}, matching ${{ inputs.version-manifest }}."
          else
            echo "::error::release commit does not name the manifest version ${VERSION}"
            printf '::error::head commit: %s\n' "$(printf '%s' "$MSG" | head -1)"
            exit 1
          fi

      - name: Create and push tag
        id: tag
        if: steps.gate.outputs.proceed == 'true'
        run: |
          TAG="${{ inputs.tag-prefix }}${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; not re-tagging."
            echo "tagged=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "tagged=true" >> "$GITHUB_OUTPUT"
          echo "Created and pushed $TAG"

      - name: Install Rust
        if: steps.tag.outputs.tagged == 'true' && inputs.dev-bump != 'none'
        uses: dtolnay/rust-toolchain@stable

      - name: Bump to next development version
        if: steps.tag.outputs.tagged == 'true' && inputs.dev-bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          STYLE: ${{ inputs.dev-bump-style }}
          PACKAGE: ${{ inputs.dev-bump-package }}
        run: |
          cargo install cargo-release --locked
          VERSION='${{ steps.version.outputs.version }}'
          BASE=${VERSION%%-*}                       # drop any existing prerelease
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          case "$STYLE" in
            alpha) NEXT_DEV="${MAJOR}.${MINOR}.$((PATCH + 1))-alpha.0" ;;
            patch) NEXT_DEV="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            *)
              echo "::error::dev-bump-style must be \"alpha\" or \"patch\", got \"${STYLE}\""
              exit 1 ;;
          esac
          echo "Next development version: $NEXT_DEV"

          # cargo-release edits every manifest that shares the version and
          # updates Cargo.lock. A `sed` on one file leaves a workspace
          # inconsistent and Cargo.lock stale. With dev-bump-package it edits
          # that one member's manifest and still refreshes Cargo.lock.
          if [ -n "$PACKAGE" ]; then
            cargo release version "$NEXT_DEV" --execute --no-confirm -p "$PACKAGE"
          else
            cargo release version "$NEXT_DEV" --execute --no-confirm
          fi

          if [ "${{ inputs.dev-bump }}" = "direct" ]; then
            git add -A
            git commit -m "chore: begin next development iteration (${NEXT_DEV})"
            git push origin main
          else
            BRANCH="chore/bump-${NEXT_DEV}"
            git checkout -b "$BRANCH"
            git add -A
            git commit -m "chore: begin next development iteration (${NEXT_DEV})"
            git push origin "$BRANCH"
            gh pr create \
              --title "chore: begin next development iteration (${NEXT_DEV})" \
              --body "Automated version bump after ${{ inputs.tag-prefix }}${VERSION}." \
              --head "$BRANCH" --base main
          fi

      - name: Summary
        if: always() && steps.gate.outputs.proceed == 'true'
        run: |
          {
            echo "## Tag release"
            if [ "${{ steps.tag.outputs.tagged }}" = "true" ]; then
              echo "- Created tag \`${{ inputs.tag-prefix }}${{ steps.version.outputs.version }}\`"
              echo "- Next dev version landed via \`${{ inputs.dev-bump }}\`"
            else
              echo "- No tag created (already existed, or the run stopped earlier)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
